services:
  itex-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itex-dashboard
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - itex-data:/app/data
      # Mount assets so logos can be updated without rebuild
      - ./public/assets:/app/public/assets:ro
    networks:
      - itex-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  itex-net:
    driver: bridge

volumes:
  itex-data:
