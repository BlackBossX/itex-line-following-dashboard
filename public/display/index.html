<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Display – ITEX 2.0 Line Following</title>
  <meta name="description" content="Public Display Panel for ITEX 2.0 Line Following Competition" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #06081a;
      --navy2:  #090c20;
      --navy3:  #0d1330;
      --navy4:  #121b40;
      --cyan:   #00c8ff;
      --cyan2:  #00e5ff;
      --gold:   #ffd700;
      --green:  #00ff88;
      --red:    #ff3c5a;
      --purple: #a855f7;
      --text:   #dceeff;
      --muted:  #4a6080;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--navy);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ── ANIMATED BG ── */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      animation: gridPan 30s linear infinite;
    }
    @keyframes gridPan {
      0% { background-position: 0 0; }
      100% { background-position: 80px 80px; }
    }

    /* Radial glow */
    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0,200,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(168,85,247,0.05) 0%, transparent 60%);
    }

    /* Floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--cyan);
      opacity: 0;
      animation: particleFly linear infinite;
    }

    /* Scan line */
    .scan-line {
      position: fixed;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.4), transparent);
      animation: scanMove 8s linear infinite;
      pointer-events: none;
    }
    @keyframes scanMove { 0% { top: -2px; } 100% { top: 100%; } }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 80px; height: 80px;
      border-color: rgba(0,200,255,0.2);
      border-style: solid;
      pointer-events: none;
    }
    .corner-tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

    /* ── MAIN DISPLAY LAYOUT ── */
    .display-root {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .disp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      border-bottom: 1px solid rgba(0,200,255,0.08);
      background: rgba(9,12,32,0.8);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    .disp-logos {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .disp-logos img {
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(0,200,255,0.5));
    }
    .disp-logos .vdiv {
      width: 1px; height: 42px;
      background: linear-gradient(to bottom, transparent, rgba(0,200,255,0.4), transparent);
    }
    .disp-event-name {
      text-align: center;
    }
    .disp-event-name .ev-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: var(--cyan);
      text-transform: uppercase;
    }
    .disp-event-name h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .disp-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: rgba(255,60,90,0.15);
      border: 1px solid rgba(255,60,90,0.4);
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--red);
      letter-spacing: 0.1em;
      font-family: 'Orbitron', monospace;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .clock-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── CONTENT ── */
    .disp-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem 2rem;
      gap: 1.5rem;
    }

    /* ── IDLE STATE ── */
    #stateIdle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    .idle-icon {
      font-size: 5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(0,200,255,0.4));
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
    .idle-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--cyan), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .idle-sub {
      font-size: clamp(0.9rem, 1.5vw, 1.2rem);
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .track-anim {
      width: min(500px, 80vw);
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), var(--cyan), transparent);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .track-anim::after {
      content: '';
      position: absolute;
      top: -4px;
      width: 12px; height: 12px;
      background: var(--gold);
      border-radius: 50%;
      animation: robotRun 2.5s ease-in-out infinite;
      box-shadow: 0 0 12px var(--gold);
    }
    @keyframes robotRun {
      0% { left: -12px; }
      100% { left: calc(100% + 12px); }
    }

    /* ── COUNTDOWN STATE ── */
    #stateCountdown {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    .cd-label {
      font-family: 'Orbitron', monospace;
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      animation: blink 1s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    .cd-number {
      font-family: 'Orbitron', monospace;
      font-size: clamp(8rem, 20vw, 18rem);
      font-weight: 900;
      line-height: 1;
      color: var(--gold);
      text-shadow:
        0 0 80px rgba(255,215,0,0.8),
        0 0 160px rgba(255,215,0,0.4);
      animation: cdPulse 1s ease infinite;
      transition: all 0.15s;
    }
    @keyframes cdPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .cd-team {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-weight: 600;
      color: #fff;
    }
    .cd-robot { font-size: clamp(0.8rem, 1.5vw, 1rem); color: var(--muted); margin-top: 0.3rem; }

    /* ── RUNNING STATE ── */
    #stateRunning {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 1000px;
    }

    .run-team-banner {
      background: linear-gradient(135deg, rgba(0,200,255,0.08), rgba(0,200,255,0.02));
      border: 1px solid rgba(0,200,255,0.2);
      border-radius: 20px;
      padding: 1.2rem 3rem;
      text-align: center;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .run-team-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }
    .rtn-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .rtn-name {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,255,255,0.2);
    }
    .rtn-robot {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* BIG TIMER */
    .big-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(5rem, 16vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: var(--cyan);
      text-shadow:
        0 0 60px rgba(0,200,255,0.7),
        0 0 120px rgba(0,200,255,0.3);
      letter-spacing: 0.04em;
      animation: timerGlow 2s ease-in-out infinite;
    }
    @keyframes timerGlow {
      0%,100% { text-shadow: 0 0 60px rgba(0,200,255,0.7), 0 0 120px rgba(0,200,255,0.3); }
      50% { text-shadow: 0 0 80px rgba(0,200,255,0.9), 0 0 160px rgba(0,200,255,0.5); }
    }
    .big-timer .timer-ms {
      font-size: 0.45em;
      color: rgba(0,200,255,0.6);
    }

    .run-status-row {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
    }
    .pill-running {
      background: rgba(0,255,136,0.1);
      border: 2px solid rgba(0,255,136,0.4);
      color: var(--green);
    }
    .pill-stopped {
      background: rgba(255,60,90,0.1);
      border: 2px solid rgba(255,60,90,0.4);
      color: var(--red);
    }
    .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }

    /* ── WINNER STATE ── */
    #stateWinner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
      animation: winnerEntrance 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    @keyframes winnerEntrance {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .winner-crown {
      font-size: clamp(4rem, 8vw, 7rem);
      animation: crownSpin 2s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255,215,0,0.8));
    }
    @keyframes crownSpin {
      0%,100% { transform: rotate(-5deg) scale(1); }
      50% { transform: rotate(5deg) scale(1.1); }
    }
    .winner-label {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.5em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .winner-name {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      animation: goldShimmer 2s ease-in-out infinite;
    }
    @keyframes goldShimmer {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.2); }
    }
    .winner-robot { font-size: clamp(1rem, 2vw, 1.5rem); color: var(--muted); }
    .winner-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(255,215,0,0.7);
    }

    /* Confetti canvas */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* ── BOTTOM STATUS BAR ── */
    .disp-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 2.5rem;
      border-top: 1px solid rgba(0,200,255,0.08);
      background: rgba(9,12,32,0.8);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }
    .footer-ws {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .footer-ws-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }
    .footer-ws-dot.connected { background: var(--green); animation: pulse 2s infinite; }
    .footer-center {
      font-family: 'Orbitron', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--muted);
    }
    .footer-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="scan-line"></div>

<!-- Corner decorations -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<div class="display-root">
  <!-- HEADER -->
  <header class="disp-header">
    <div class="disp-logos">
      <img src="/assets/school-logo.png" alt="School" />
      <div class="vdiv"></div>
      <img src="/assets/itex-logo.png" alt="ITEX" />
      <div class="vdiv"></div>
      <img src="/assets/ICTnew.png" alt="ICT" />
    </div>
    <div class="disp-event-name">
      <div class="ev-label">ITEX 2.0 • ICT Society</div>
      <h1>Line Following Robot</h1>
    </div>
    <div class="disp-header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
      <div class="clock-display" id="clockDisplay">--:--:--</div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="disp-content">

    <!-- IDLE -->
    <div id="stateIdle" style="display:flex">
      <div class="idle-icon">🤖</div>
      <div class="idle-title">Ready to Race</div>
      <div class="idle-sub">Awaiting the next competitor…</div>
      <div class="track-anim"></div>
    </div>

    <!-- COUNTDOWN -->
    <div id="stateCountdown">
      <div class="cd-team" id="cdTeamName">Team Name</div>
      <div class="cd-robot" id="cdRobotName">Robot</div>
      <div class="cd-label">🚦 GET READY</div>
      <div class="cd-number" id="cdNumber">5</div>
    </div>

    <!-- RUNNING -->
    <div id="stateRunning">
      <div class="run-team-banner">
        <div class="rtn-label">Now on Track</div>
        <div class="rtn-name" id="runTeamName">—</div>
        <div class="rtn-robot" id="runRobotName">—</div>
      </div>
      <div class="big-timer" id="bigTimer">
        00:00<span class="timer-ms">.000</span>
      </div>
      <div class="run-status-row">
        <div class="status-pill pill-running" id="runStatusPill">
          <div class="pill-dot"></div>
          <span id="runStatusText">RUNNING</span>
        </div>
      </div>
    </div>

    <!-- WINNER -->
    <div id="stateWinner">
      <div class="winner-crown">👑</div>
      <div class="winner-label">🏆 Champion</div>
      <div class="winner-name" id="winnerName">—</div>
      <div class="winner-robot" id="winnerRobot">—</div>
      <div class="winner-time" id="winnerTime">—</div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="disp-footer">
    <div class="footer-ws">
      <div class="footer-ws-dot" id="footerWsDot"></div>
      <span id="footerWsLabel">Connecting…</span>
    </div>
    <div class="footer-center">ITEX 2.0 • Line Following Competition</div>
    <div class="footer-time" id="footerTime">--:-- --</div>
  </footer>
</div>

<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('clockDisplay').textContent = t;
    document.getElementById('footerTime').textContent = t;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Particles ──
  (function initParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        top:${Math.random() * 100}%;
        animation-duration:${Math.random() * 20 + 15}s;
        animation-delay:${Math.random() * -20}s;
        opacity:0;
      `;
      // random colors
      const colors = ['#00c8ff','#ffd700','#00ff88','#a855f7'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationName = 'particleFade';
      container.appendChild(p);
    }
    // Add keyframe
    const style = document.createElement('style');
    style.textContent = `
      @keyframes particleFade {
        0% { opacity:0; transform:translateY(0) scale(0); }
        20% { opacity:0.6; transform:translateY(-30px) scale(1); }
        80% { opacity:0.3; }
        100% { opacity:0; transform:translateY(-120px) scale(0.5); }
      }
    `;
    document.head.appendChild(style);
  })();

  // ── Confetti ──
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confettiActive = false;
  let confettiPieces = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function launchConfetti() {
    confettiActive = true;
    confettiPieces = [];
    const colors = ['#ffd700','#00c8ff','#ff3c5a','#00ff88','#a855f7','#ffffff'];
    for (let i = 0; i < 200; i++) {
      confettiPieces.push({
        x: Math.random() * canvas.width,
        y: -10,
        w: Math.random() * 12 + 4,
        h: Math.random() * 6 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 4 + 2,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.2,
        opacity: 1
      });
    }
    animateConfetti();
  }

  function animateConfetti() {
    if (!confettiActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiPieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.rot += p.rotV;
      if (p.y > canvas.height + 20) { p.y = -10; p.x = Math.random() * canvas.width; p.vy = Math.random() * 2 + 1; }
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    requestAnimationFrame(animateConfetti);
  }

  function stopConfetti() {
    confettiActive = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // ── Format time ──
  function fmtTime(ms) {
    if (!ms && ms !== 0) return '00:00<span class="timer-ms">.000</span>';
    const mins = Math.floor(ms / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    const millis = ms % 1000;
    return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}<span class="timer-ms">.${String(Math.floor(millis)).padStart(3,'0')}</span>`;
  }

  function fmtTimePlain(ms) {
    if (!ms && ms !== 0) return '—';
    const mins = Math.floor(ms / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    const millis = ms % 1000;
    return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${String(Math.floor(millis)).padStart(3,'0')}`;
  }

  // ── State ──
  let currentState = {};

  function showState(phase) {
    document.getElementById('stateIdle').style.display = 'none';
    document.getElementById('stateCountdown').style.display = 'none';
    document.getElementById('stateRunning').style.display = 'none';
    document.getElementById('stateWinner').style.display = 'none';

    if (phase === 'idle') document.getElementById('stateIdle').style.display = 'flex';
    else if (phase === 'countdown') document.getElementById('stateCountdown').style.display = 'flex';
    else if (phase === 'running' || phase === 'finished') document.getElementById('stateRunning').style.display = 'flex';
    else if (phase === 'winner') document.getElementById('stateWinner').style.display = 'flex';
  }

  function render(state) {
    currentState = state;
    showState(state.phase);

    // Countdown
    if (state.phase === 'countdown') {
      document.getElementById('cdTeamName').textContent = state.currentTeam?.name || '—';
      document.getElementById('cdRobotName').textContent = '🤖 ' + (state.currentTeam?.robotName || '—');
      document.getElementById('cdNumber').textContent = state.countdown?.seconds ?? '?';
    }

    // Running / Finished
    if (state.phase === 'running' || state.phase === 'finished') {
      document.getElementById('runTeamName').textContent = state.currentTeam?.name || '—';
      document.getElementById('runRobotName').textContent = '🤖 ' + (state.currentTeam?.robotName || '—');
      if (!state.stopwatch?.running) {
        const pill = document.getElementById('runStatusPill');
        pill.className = 'status-pill pill-stopped';
        document.getElementById('runStatusText').textContent = 'STOPPED';
        const timerEl = document.getElementById('bigTimer');
        timerEl.style.color = '#ff3c5a';
        timerEl.style.textShadow = '0 0 60px rgba(255,60,90,0.7), 0 0 120px rgba(255,60,90,0.3)';
        timerEl.style.animation = 'none';
      } else {
        const pill = document.getElementById('runStatusPill');
        pill.className = 'status-pill pill-running';
        document.getElementById('runStatusText').textContent = 'RUNNING';
        const timerEl = document.getElementById('bigTimer');
        timerEl.style.color = 'var(--cyan)';
        timerEl.style.textShadow = '';
        timerEl.style.animation = 'timerGlow 2s ease-in-out infinite';
      }
      document.getElementById('bigTimer').innerHTML = fmtTime(state.stopwatch?.elapsed || 0);
    }

    // Winner
    if (state.phase === 'winner' && state.winner) {
      document.getElementById('winnerName').textContent = state.winner.name || '—';
      document.getElementById('winnerRobot').textContent = '🤖 ' + (state.winner.robotName || '—');
      document.getElementById('winnerTime').textContent = fmtTimePlain(state.winner.bestTime);
      launchConfetti();
    } else {
      stopConfetti();
    }
  }

  // ── WebSocket ──
  let ws;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => {
      document.getElementById('footerWsDot').classList.add('connected');
      document.getElementById('footerWsLabel').textContent = 'Connected';
    };
    ws.onclose = () => {
      document.getElementById('footerWsDot').classList.remove('connected');
      document.getElementById('footerWsLabel').textContent = 'Reconnecting…';
      setTimeout(connect, 2000);
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'FULL_STATE') {
        render(msg.state);
      } else if (msg.type === 'TICK') {
        if (currentState.phase === 'running') {
          document.getElementById('bigTimer').innerHTML = fmtTime(msg.elapsed);
        }
      } else if (msg.type === 'COUNTDOWN_TICK') {
        document.getElementById('cdNumber').textContent = msg.seconds > 0 ? msg.seconds : '🚦';
        if (msg.seconds <= 0) {
          setTimeout(() => { showState('running'); }, 300);
        }
      }
    };
  }
  connect();
</script>
</body>
</html>
